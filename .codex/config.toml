# Project-scoped Codex multi-agent defaults for J&A Automation.
# This file intentionally does not redefine your globally configured MCP server URLs/credentials.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
interrupt_message = true
