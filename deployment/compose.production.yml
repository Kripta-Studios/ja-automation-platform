services:
  site:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.site
    image: ja-automation-site:${JA_RELEASE_TAG:-local}
    restart: unless-stopped
    ports:
      - 127.0.0.1:5101:3000
    read_only: true
    tmpfs:
      - /tmp
      - /app/website/.next/cache:uid=10002,gid=10002,mode=0750
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/j-aautomation/en').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  portal:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.portal
    image: ja-automation-portal:${JA_RELEASE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: /etc/jaautomation/jaautomation.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 5100
      JA_DATABASE_PATH: /var/lib/jaautomation/data/jaautomation.sqlite
      JA_MIGRATIONS_PATH: /app/migrations
      JA_DOCUMENT_ROOT: /var/lib/jaautomation/files
      JA_PUBLIC_BASE_PATH: /j-aautomation
      JA_PORTAL_BASE_PATH: /j-aautomation/app
      JA_CHROMIUM_PATH: /usr/bin/chromium
    ports:
      - 127.0.0.1:5100:5100
    volumes:
      - /var/lib/jaautomation:/var/lib/jaautomation
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'node -e "fetch(''http://127.0.0.1:5100/j-aautomation/health/ready'').then(r=>{if(!r.ok)process.exit(1)})"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  jobs:
    profiles: [jobs]
    image: ja-automation-portal:${JA_RELEASE_TAG:-local}
    env_file:
      - path: /etc/jaautomation/jaautomation.env
        required: false
    environment:
      JA_DATABASE_PATH: /var/lib/jaautomation/data/jaautomation.sqlite
      JA_MIGRATIONS_PATH: /app/migrations
      JA_DOCUMENT_ROOT: /var/lib/jaautomation/files
      JA_JOB_ACTOR_ID: ${JA_JOB_ACTOR_ID:-}
      JA_CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - /var/lib/jaautomation:/var/lib/jaautomation
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    command: [node, /app/deployment/jobs-run.mjs]
  demo-seed:
    profiles: [tools]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.portal
      target: tools
    working_dir: /workspace/packages/database
    user: 10001:10001
    environment:
      COREPACK_HOME: /tmp/corepack
      JA_DATABASE_PATH: /var/lib/jaautomation/data/jaautomation.sqlite
      JA_MIGRATIONS_PATH: /workspace/migrations
      JA_DOCUMENT_ROOT: /var/lib/jaautomation/files
      JA_FIXTURE_RESET_DOCUMENTS: ${JA_FIXTURE_RESET_DOCUMENTS:-false}
    volumes:
      - /var/lib/jaautomation:/var/lib/jaautomation
    command: [node, --experimental-strip-types, src/demo-seed.ts]
  bootstrap-owner:
    profiles: [tools]
    build:
      context: ..
      dockerfile: deployment/Dockerfile.portal
      target: tools
    working_dir: /workspace
    user: 10001:10001
    env_file:
      - path: /etc/jaautomation/jaautomation.env
        required: false
    environment:
      COREPACK_HOME: /tmp/corepack
      JA_DATABASE_PATH: /var/lib/jaautomation/data/jaautomation.sqlite
      JA_MIGRATIONS_PATH: /workspace/migrations
      JA_PORTAL_BASE_PATH: /j-aautomation/app
    volumes:
      - /var/lib/jaautomation:/var/lib/jaautomation
    command: [node, --experimental-strip-types, apps/portal/src/cli/bootstrap-owner.ts]
